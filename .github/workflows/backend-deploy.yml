name: Backend CI/CD

# Runs only when backend code (or this workflow) changes.
on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-deploy.yml'
  workflow_dispatch:

concurrency:
  group: backend-deploy
  cancel-in-progress: false

jobs:
  test:
    name: Build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx tsc --noEmit
      - run: npx jest --ci --passWithNoTests

  deploy:
    name: Deploy to server
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package backend (no node_modules)
        run: tar czf /tmp/backend.tgz -C backend --exclude=node_modules --exclude=dist --exclude=.env .

      - name: Set up SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Ship & redeploy (exec channel; SFTP is disabled on host)
        env:
          HOST: 176.126.87.142
          USER: root
        run: |
          OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
          ssh $OPTS -i ~/.ssh/deploy_key "$USER@$HOST" "mkdir -p /home/inspectaapi/app"
          ssh $OPTS -i ~/.ssh/deploy_key "$USER@$HOST" "cat > /tmp/backend.tgz" < /tmp/backend.tgz
          # The server .env is operator-owned: this deploy never writes to it,
          # edits it, or deletes it. The commit SHA is handed to compose as a
          # shell variable instead of being stamped into the file, and the
          # cleanup below explicitly preserves it.
          ssh $OPTS -i ~/.ssh/deploy_key "$USER@$HOST" '
            set -e
            cd /home/inspectaapi/app
            find . -maxdepth 1 -mindepth 1 ! -name .env -exec rm -rf {} +
            tar xzf /tmp/backend.tgz -C .
            BUILD_VERSION=${{ github.sha }} docker compose -f docker-compose.prod.yml up -d --build
            docker image prune -f >/dev/null 2>&1 || true
          '

      - name: Health check (retry until the API is listening)
        env:
          HOST: 176.126.87.142
          USER: root
        run: |
          OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
          # The container runs prisma db push + seed before Node listens, so the
          # port can accept-then-reset for ~15s. Poll for up to ~2 minutes.
          for i in $(seq 1 24); do
            if ssh $OPTS -i ~/.ssh/deploy_key "$USER@$HOST" 'curl -fsS -m 5 http://127.0.0.1:5010/api/health' ; then
              echo ""
              echo "✅ backend healthy after $((i*5))s"
              exit 0
            fi
            echo "waiting for backend to come up... (attempt $i)"
            sleep 5
          done
          echo "❌ backend did not become healthy in time; recent logs:"
          ssh $OPTS -i ~/.ssh/deploy_key "$USER@$HOST" 'docker logs --tail 30 inspecta-prod-backend 2>&1' || true
          exit 1
