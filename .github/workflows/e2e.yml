name: End-to-end tests

# Runs the API end-to-end suite and the real-browser suite on every push and pull request,
# plus a nightly read-only check of the deployed site. It never blocks a deploy: it reports.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '30 5 * * *'

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API end-to-end (real app, real database)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: inspecta_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/inspecta_e2e?schema=public
      JWT_ACCESS_SECRET: e2e-access-secret-not-for-production
      JWT_REFRESH_SECRET: e2e-refresh-secret-not-for-production
      CLOUDINARY_CLOUD_NAME: e2e
      CLOUDINARY_API_KEY: e2e
      CLOUDINARY_API_SECRET: e2e
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run test:e2e

  browser:
    name: Browser end-to-end (every feature, every module)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: inspecta_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/inspecta_e2e?schema=public
      JWT_ACCESS_SECRET: e2e-access-secret-not-for-production
      JWT_REFRESH_SECRET: e2e-refresh-secret-not-for-production
      CLOUDINARY_CLOUD_NAME: e2e
      CLOUDINARY_API_KEY: e2e
      CLOUDINARY_API_SECRET: e2e
      CORS_ORIGIN: http://localhost:3000
      DEBUG_LOG_SECRETS: 'true'   # the debug-log tests read verification links; throwaway CI database only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Backend - install, migrate, create the test company
        working-directory: backend
        env:
          # Scoped to this step only: the job-level env is shared with the frontend step below, and the
          # frontend's own dev server (server.ts) also reads $PORT, defaulting to 3000 — a job-level PORT
          # here would make it try to bind the backend's port too and collide.
          PORT: '4000'
        run: |
          npm ci
          npx prisma generate
          npx prisma migrate deploy
          # The seed script's stdout also carries console.log noise from the app (e.g. the debug log
          # mirrors events to the console), so only the E2E_*= lines it prints are safe to feed to
          # $GITHUB_ENV — piping everything in broke the env-file format.
          npx tsx scripts/e2e-seed.ts | tee /tmp/e2e-seed.out
          grep '^E2E_' /tmp/e2e-seed.out >> "$GITHUB_ENV"

      - name: Backend - start
        working-directory: backend
        env:
          PORT: '4000'
        run: nohup npx tsx src/index.ts > /tmp/backend.log 2>&1 &

      - name: Frontend - install and start
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          nohup npm run dev > /tmp/frontend.log 2>&1 &

      - name: Wait for both servers
        run: |
          for i in $(seq 1 60); do
            curl -fsS http://localhost:4000/api/health >/dev/null && curl -fsS http://localhost:3000/ >/dev/null && exit 0
            sleep 2
          done
          echo "servers did not start"; tail -n 40 /tmp/backend.log /tmp/frontend.log; exit 1

      - name: Browser tests
        working-directory: frontend
        run: npx playwright test e2e/public.spec.ts e2e/features.spec.ts e2e/walk.spec.ts e2e/debuglog.spec.ts

      - name: Keep the report when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            frontend/e2e-report
            frontend/e2e-results
            /tmp/backend.log
          retention-days: 7

  live:
    name: Deployed site (read-only, nightly)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      E2E_LIVE: '1'
      E2E_WEB_URL: https://www.inspecta.africa
      E2E_API_URL: https://api.inspecta.africa/api
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: live-e2e-report
          path: |
            frontend/e2e-report
            frontend/e2e-results
          retention-days: 7
